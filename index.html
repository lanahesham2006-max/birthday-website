<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday 🎂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #d9c7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #4b315c;
      overflow-x: hidden;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: rgba(255,255,255,0.85);
      padding: 35px 20px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .cake {
      font-size: 80px;
      margin: 15px;
    }

    p {
      font-size: 20px;
      line-height: 1.8;
    }

    button {
      border: none;
      background: #9b6cff;
      color: white;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #8050e8;
    }

    #message {
      display: none;
      margin-top: 25px;
      animation: fade 1s ease;
    }

    .hearts {
      font-size: 30px;
      margin-top: 20px;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="cake">🎂</div>

    <h1>Happy Birthday! 🎉</h1>

    <p>
      النهارده يوم مميز جدًا ✨
      <br>
      لأنه يوم ميلاد شخص مميز جدًا ❤️
    </p>

    <button onclick="showMessage()">
      اضغطي هنا للمفاجأة 🎁
    </button>

    <div id="message">

      <h2>🎀 كل سنة وإنتِ طيبة 🎀</h2>

      <p>
        أتمنى السنة الجديدة من عمرك تكون مليانة
        فرحة ونجاح وضحك وأيام حلوة كتير جدًا 💕
        <br><br>
        وإن كل اللي نفسك فيه يتحقق ✨
      </p>

      <div class="hearts">
        💗 💕 💖 💕 💗
      </div>

    </div>

  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
</html>
